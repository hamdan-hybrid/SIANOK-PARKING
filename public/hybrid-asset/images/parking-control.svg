<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid Parking barrier gate and AI camera</title>
  <desc id="desc">A parking lane with a barrier gate on the left and an AI camera on the right.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#f9fcff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44535f"/>
      <stop offset="1" stop-color="#26333d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#254968" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="320" height="150" rx="10" fill="url(#sky)"/>
  <path d="M0 111h320v39H0z" fill="url(#road)"/>
  <path d="M0 111h320" stroke="#9eb5c7" stroke-width="1"/>
  <g opacity=".76" stroke="#e4edf3" stroke-width="3" stroke-linecap="round">
    <path d="M105 131h24"/><path d="M159 131h24"/><path d="M213 131h24"/><path d="M267 131h24"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="30" y="79" width="18" height="36" rx="4" fill="#173b67"/>
    <rect x="25" y="75" width="28" height="7" rx="3.5" fill="#285b91"/>
    <circle cx="39" cy="91" r="3" fill="#52d0a3"/>
    <rect x="44" y="81" width="111" height="7" rx="3.5" fill="#e2a755" transform="rotate(-5 44 81)">
      <animateTransform attributeName="transform" type="rotate" values="-5 44 81;-66 44 81;-66 44 81;-5 44 81" keyTimes="0;.28;.7;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <path d="M58 104h20" stroke="#f2c46e" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M247 37h22a5 5 0 0 1 5 5v14h-32V42a5 5 0 0 1 5-5Z" fill="#173b67"/>
    <path d="M251 31h14a3 3 0 0 1 3 3v4h-20v-4a3 3 0 0 1 3-3Z" fill="#285b91"/>
    <circle cx="261" cy="48" r="7" fill="#dff4ff" stroke="#65bde5" stroke-width="3">
      <animate attributeName="r" values="6;8;6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M251 56v22" stroke="#285b91" stroke-width="4" stroke-linecap="round"/>
    <text x="261" y="93" fill="#47719c" font-family="Arial,sans-serif" font-size="9" font-weight="700" text-anchor="middle">AI CAMERA</text>
  </g>
  <path d="M72 108h176" stroke="#a7c0d2" stroke-width="1" stroke-dasharray="3 5" opacity=".65"/>
</svg>
